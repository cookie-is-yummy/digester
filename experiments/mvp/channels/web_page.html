<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot test thread</title>
<style>
  :root {
    --bg: #f4f4f6; --panel: #ffffff; --ink: #16161a; --quiet: #6b6b76; --line: #e2e2e8;
    --me: #0a84ff; --me-ink: #ffffff; --bot: #e9e9ee; --bot-ink: #16161a; --accent: #0a84ff; --warn: #b25c00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111114; --panel: #1b1b20; --ink: #f1f1f4; --quiet: #9a9aa6; --line: #2c2c34;
            --bot: #2a2a31; --bot-ink: #f1f1f4; --warn: #ffb454; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { height: 100%; max-width: 1080px; margin: 0 auto; padding: 16px; display: grid; gap: 16px;
          grid-template-columns: minmax(0, 1fr) 300px; }
  .chat, .side { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-height: 0; }
  .chat { display: flex; flex-direction: column; }
  .head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
  .head b { font-size: 16px; }
  .head span { color: var(--quiet); font-size: 13px; }
  #thread { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; flex-direction: column; max-width: 82%; }
  .row.in { align-self: flex-end; align-items: flex-end; }
  .row.out { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 9px 13px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .in .bubble { background: var(--me); color: var(--me-ink); border-bottom-right-radius: 5px; }
  .out .bubble { background: var(--bot); color: var(--bot-ink); border-bottom-left-radius: 5px; }
  .bubble a { color: inherit; text-decoration: underline; }
  .meta { font-size: 11.5px; color: var(--quiet); margin: 2px 6px 8px; display: flex; gap: 8px; align-items: center; }
  .tap { border: 1px solid var(--line); background: none; border-radius: 12px; padding: 0 7px; cursor: pointer;
         font-size: 13px; line-height: 20px; color: var(--ink); opacity: .55; }
  .tap:hover, .tap.on { opacity: 1; border-color: var(--accent); }
  .typing { color: var(--quiet); font-size: 13px; padding: 0 22px 8px; min-height: 24px; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; height: 42px; max-height: 140px; padding: 10px 12px; border-radius: 20px;
             border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  button.send { border: 0; background: var(--accent); color: #fff; border-radius: 20px; padding: 0 18px; font: inherit;
                font-weight: 600; cursor: pointer; }
  button.send:disabled { opacity: .4; cursor: default; }
  .side { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
  .side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--quiet); margin: 0 0 8px; }
  select, .btn { width: 100%; font: inherit; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line);
                 background: var(--bg); color: var(--ink); }
  .btn { cursor: pointer; text-align: left; margin-top: 6px; }
  .btn:hover { border-color: var(--accent); }
  .btn.quiet { color: var(--quiet); }
  .clock { font-size: 17px; font-weight: 600; }
  .small { font-size: 12.5px; color: var(--quiet); margin-top: 4px; }
  .ahead { color: var(--warn); }
  .rule { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin-bottom: 6px; font-size: 13.5px; }
  .rule .small { margin-top: 2px; }
  .try { font-size: 13px; color: var(--accent); cursor: pointer; display: block; margin: 5px 0; background: none;
         border: 0; padding: 0; text-align: left; font-family: inherit; }
  @media (max-width: 760px) {
    .wrap { grid-template-columns: minmax(0, 1fr); height: auto; }
    .chat { height: 78vh; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="chat">
    <div class="head"><b>Digest bot</b><span id="status">connecting…</span></div>
    <div id="thread"></div>
    <div class="typing" id="typing"></div>
    <form id="form">
      <textarea id="box" placeholder="Text the bot…" autofocus></textarea>
      <button class="send" id="send">Send</button>
    </form>
  </section>
  <aside class="side">
    <div>
      <h2>Texting as</h2>
      <select id="who"></select>
    </div>
    <div>
      <h2>The bot's clock</h2>
      <div class="clock" id="now">–</div>
      <div class="small" id="ahead"></div>
      <button class="btn" data-op="to_next">Jump to the next timed send</button>
      <button class="btn" data-op="add_minutes" data-minutes="60">Forward 1 hour</button>
      <button class="btn" data-op="add_minutes" data-minutes="1440">Forward 1 day</button>
      <div class="small">Moving the clock makes timed and repeating rules fire now. It only moves forward.</div>
    </div>
    <div>
      <h2>Rules</h2>
      <div id="rules"></div>
    </div>
    <div>
      <h2>Things to try</h2>
      <button class="try">what can I make with chicken and rice?</button>
      <button class="try">remind me in two hours to watch something that gets me motivated</button>
      <button class="try">send me a pasta recipe every Friday at 7pm, nothing with cream</button>
      <button class="try">my rules</button>
    </div>
    <div>
      <button class="btn quiet" data-op="start_over">Start over (clear this person's rules and thread)</button>
      <button class="btn quiet" data-op="start_over" data-welcome="1">Start over from the welcome message</button>
      <div class="small">This page is a test thread on this computer. Nothing here is sent to a phone.</div>
    </div>
  </aside>
</div>
<script>
const TOKEN = "__TOKEN__";
const $ = id => document.getElementById(id);
let me = null, lastCount = -1, lastSig = "";

const esc = s => s.replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);

async function api(path, body) {
  const opt = {headers: {"X-Test-Token": TOKEN}};
  if (body) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function draw(s) {
  if (!s.people || !s.people.length) { $("status").textContent = "no people in people.json"; return; }
  me = s.me;
  const who = $("who");
  const opts = s.people.map(p => `<option value="${esc(p.handle)}">${esc(p.name)} (${esc(p.handle)})</option>`).join("");
  if (who.dataset.sig !== opts) { who.innerHTML = opts; who.dataset.sig = opts; }
  who.value = me;
  $("status").textContent = s.problem ? s.problem : s.ready ? "test thread · same bot as iMessage" : "loading the library (about a minute)…";
  $("now").textContent = s.now;
  $("ahead").innerHTML = s.ahead_minutes ? `<span class="ahead">${fmtAhead(s.ahead_minutes)} ahead of real time</span> · ${esc(s.timezone)}` : `real time · ${esc(s.timezone)}`;
  $("typing").textContent = s.busy ? (s.ready ? "typing…" : "waiting for the library to load…") : "";
  $("rules").innerHTML = s.rules.length ? s.rules.map(r =>
    `<div class="rule"><b>${r.number}.</b> ${esc(r.goal)}<div class="small">${esc(r.when)}${r.status !== "active" ? " · " + esc(r.status) : ""}${r.next ? "<br>next: " + esc(r.next) : ""}</div></div>`).join("")
    : `<div class="small">None yet.</div>`;
  const sig = JSON.stringify(s.messages.map(m => [m.id, m.reaction]));
  if (sig !== lastSig) {
    lastSig = sig;
    const t = $("thread");
    t.innerHTML = s.messages.map(m => {
      const taps = m.dir === "out"
        ? `<button class="tap ${m.reaction === "up" ? "on" : ""}" data-ref="${m.ref}" data-kind="up">👍</button><button class="tap ${m.reaction === "down" ? "on" : ""}" data-ref="${m.ref}" data-kind="down">👎</button>` : "";
      return `<div class="row ${m.dir}"><div class="bubble">${linkify(m.text)}</div><div class="meta">${esc(m.time)}${taps}</div></div>`;
    }).join("");
    if (s.messages.length !== lastCount) t.scrollTop = t.scrollHeight;
    lastCount = s.messages.length;
  }
}
const fmtAhead = m => m >= 1440 ? `${Math.floor(m / 1440)} d ${Math.floor(m % 1440 / 60)} h` : m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`;

async function poll() {
  try { draw(await api("/api/state" + (me ? "?as=" + encodeURIComponent(me) : ""))); }
  catch (e) { $("status").textContent = "the bot is not running (start it again, then reload this page)"; }
}
async function send(text) {
  text = text.trim();
  if (!text || !me) return;
  $("box").value = "";
  await api("/api/send", {handle: me, text});
  poll();
}
$("form").addEventListener("submit", e => { e.preventDefault(); send($("box").value); });
$("box").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("box").value); } });
$("who").addEventListener("change", e => { me = e.target.value; lastSig = ""; lastCount = -1; poll(); });
$("thread").addEventListener("click", e => {
  const b = e.target.closest(".tap");
  if (b) api("/api/tapback", {handle: me, ref: b.dataset.ref, kind: b.dataset.kind}).then(poll);
});
document.querySelectorAll(".btn[data-op]").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.op === "start_over" && !confirm("Clear this test person's rules, history and thread?")) return;
  api("/api/control", {op: b.dataset.op, handle: me, minutes: Number(b.dataset.minutes || 0), with_welcome: !!b.dataset.welcome}).then(poll);
}));
document.querySelectorAll(".try").forEach(b => b.addEventListener("click", () => { $("box").value = b.textContent; $("box").focus(); }));
poll();
setInterval(poll, 800);
</script>
</body>
</html>
